spring.application.name=backend
server.port=8080

# DataSource
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgres:5432/umsoft_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:1111}

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# GigaChat
gigachat.api.auth-key=${GIGACHAT_API_KEY}
gigachat.api.scope=GIGACHAT_API_PERS
gigachat.api.verify-ssl=false

# ???????????
logging.level.com.umsoft.backend=DEBUG